Global:
  use_gpu: true
  epoch_num: 100
  log_smooth_window: 20
  print_batch_step: 10
  save_model_dir: ../models/fine_tuned/
  save_epoch_step: 3
  eval_batch_step: [0, 2000]
  train_batch_size_per_card: 64
  test_batch_size_per_card: 64
  image_shape: [3, 32, 320]
  max_text_length: 25
  character_type: en
  character_dict_path: ppocr/utils/ic15_dict.txt
  loss_type: ctc
  optimizer:
    name: Adam
    beta1: 0.9
    beta2: 0.999
    lr:
      name: Cosine
      learning_rate: 0.001
  pretrained_model: ./models/pretrained/rec_mv3_none_bilstm_ctc_v2.0_train/best_accuracy

Train:
  dataset:
    name: SimpleDataSet
    data_dir: ./data/images/
    label_file_list: [./data/train.txt]
  loader:
    shuffle: true
    batch_size_per_card: 64
    drop_last: true
    num_workers: 8

Eval:
  dataset:
    name: SimpleDataSet
    data_dir: ./data/images/
    label_file_list: [./data/train.txt]
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 64
    num_workers: 4
